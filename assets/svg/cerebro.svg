<path d="M 246 253 C 270 248, 300 250, 322 262" stroke="#f8c5d2" stroke-width="2.2" stroke-linecap="round" opacity="0.62" />
<path d="M 238 266 C 268 260, 304 262, 332 275" stroke="#f8c5d2" stroke-width="2.2" stroke-linecap="round" opacity="0.58" />
<path d="M 238 280 C 268 274, 304 276, 332 289" stroke="#f8c5d2" stroke-width="2.2" stroke-linecap="round" opacity="0.54" />
<path d="M 242 294 C 268 289, 298 291, 324 302" stroke="#f8c5d2" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</g>
<g id="cerebro" filter="url(#flt_sombra_interior)">
<g clip-path="url(#clip_cerebro)">
<!-- Degradado base continuo para todo el hemisferio -->
<rect x="40" y="75" width="320" height="225" fill="url(#gr_cerebro_hemisferio)" />
<!-- Sombra envolvente inferior para dar volumen al lóbulo frontal, temporal y occipital -->
