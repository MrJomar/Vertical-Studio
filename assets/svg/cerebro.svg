<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
<defs>
<radialGradient id="gr_aura" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#f4a6b8" stop-opacity="0.34" />
<stop offset="65%" stop-color="#e37c9c" stop-opacity="0.1" />
<stop offset="100%" stop-color="#c2557a" stop-opacity="0" />
</radialGradient>
<linearGradient id="gr_cerebro_hemisferio" x1="12%" y1="10%" x2="88%" y2="90%">
<stop offset="0%" stop-color="#f8bcc9" />
<stop offset="40%" stop-color="#ee8ea9" />
<stop offset="76%" stop-color="#d8698c" />
<stop offset="100%" stop-color="#b94c71" />
</linearGradient>
<linearGradient id="gr_cerebelo" x1="20%" y1="10%" x2="85%" y2="90%">
<stop offset="0%" stop-color="#f39cb2" />
<stop offset="65%" stop-color="#d8688b" />
<stop offset="100%" stop-color="#b4476b" />
</linearGradient>
<linearGradient id="gr_tronco" x1="25%" y1="0%" x2="75%" y2="100%">
<stop offset="0%" stop-color="#e982a0" />
<stop offset="55%" stop-color="#cf5f82" />
<stop offset="100%" stop-color="#a83e62" />
</linearGradient>
<linearGradient id="gr_reflejo_discreto" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
<stop offset="65%" stop-color="#ffffff" stop-opacity="0.14" />
<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
</linearGradient>
<filter id="flt_sombra_interior" x="-15%" y="-15%" width="130%" height="130%">
<feFlood flood-color="#8e2f55" flood-opacity="0.38" result="flood" />
<feComposite in="flood" in2="SourceAlpha" operator="in" result="mask" />
<feGaussianBlur in="mask" stdDeviation="5" result="blur" />
<feOffset dx="0" dy="4" result="offsetBlur" />
<feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="innerShadow" />
<feMerge>
<feMergeNode in="SourceGraphic" />
<feMergeNode in="innerShadow" />
</feMerge>
</filter>
<filter id="flt_sombra_surco" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur" />
<feOffset dx="0" dy="2.2" result="offset" />
<feFlood flood-color="#8e2f55" flood-opacity="0.48" result="color" />
<feComposite in="color" in2="offset" operator="in" result="shadow" />
<feMerge>
<feMergeNode in="shadow" />
<feMergeNode in="SourceGraphic" />
</feMerge>
</filter>
<clipPath id="clip_cerebro">
<path d="M 192 84
C 142 84, 82 104, 60 144
C 44 174, 48 212, 74 232
C 92 246, 118 248, 138 242
C 132 256, 138 274, 158 282
C 186 294, 232 290, 260 272
C 278 260, 286 246, 290 236
C 324 232, 348 212, 350 184
C 352 154, 332 122, 296 102
C 266 86, 228 84, 192 84 Z" />
</clipPath>
</defs>
<g id="aura">
<ellipse cx="204" cy="212" rx="176" ry="132" fill="url(#gr_aura)" />
</g>
